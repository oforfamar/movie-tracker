<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Movie Tracker{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />

  <!-- Tailwind Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            plex: {
              DEFAULT: '#e5a00d',
              dark:    '#c47d0e',
              light:   '#f5c842',
            },
          },
          aspectRatio: {
            'poster': '2 / 3',
          },
        },
      },
    }
  </script>

  <style type="text/tailwindcss">
    @layer utilities {
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .line-clamp-3 {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    }
  </style>
</head>

<body class="bg-gray-950 text-gray-100 min-h-screen font-sans antialiased">

  <!-- Top navigation bar -->
  <header class="sticky top-0 z-40 bg-gray-950/95 backdrop-blur border-b border-gray-800">
    <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 flex items-center justify-between h-14">
      <!-- Logo + nav -->
      <div class="flex items-center gap-6">
        <a href="/movies" class="flex items-center gap-2 text-plex font-bold text-lg tracking-tight hover:text-plex-light transition-colors">
          <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
          </svg>
          Movie Tracker
        </a>
        <nav class="flex items-center gap-1">
          <a href="/movies"
            class="px-3 py-1.5 rounded-md text-sm font-medium transition-colors
                   {% if request.url.path.startswith('/movies') %}bg-gray-800 text-white{% else %}text-gray-400 hover:text-gray-200 hover:bg-gray-800/60{% endif %}">
            Movies
          </a>
          <a href="/series"
            class="px-3 py-1.5 rounded-md text-sm font-medium transition-colors
                   {% if request.url.path.startswith('/series') %}bg-gray-800 text-white{% else %}text-gray-400 hover:text-gray-200 hover:bg-gray-800/60{% endif %}">
            Series
          </a>
        </nav>
      </div>

      <!-- Right side actions -->
      <div class="flex items-center gap-3">
        {% if last_fetched is defined and last_fetched %}
        <span class="hidden sm:block text-xs text-gray-500">
          Updated {{ last_fetched }}
        </span>
        {% endif %}
        <button
          id="refresh-btn"
          onclick="triggerFetch()"
          class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-md bg-gray-800 hover:bg-gray-700 border border-gray-700 hover:border-gray-600 transition-colors"
        >
          <svg id="refresh-icon" class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          <span id="refresh-label">Refresh Now</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Page content -->
  <main class="max-w-screen-2xl mx-auto px-4 sm:px-6 py-6">
    {% block content %}{% endblock %}
  </main>

  <!-- Radarr "Add Movie" modal -->
  <div id="radarr-modal" class="fixed inset-0 z-50 hidden">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" onclick="closeModal()"></div>
    <!-- Panel -->
    <div class="relative flex items-center justify-center min-h-screen p-4">
      <div class="relative bg-gray-900 border border-gray-700 rounded-xl shadow-2xl w-full max-w-md p-6">
        <!-- Close button -->
        <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-500 hover:text-gray-300 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>

        <h2 class="text-lg font-semibold text-white mb-1">Add to Radarr</h2>
        <p id="modal-movie-title" class="text-plex font-medium text-sm mb-5"></p>

        <label class="block text-sm text-gray-400 mb-1.5">Download folder</label>
        <select
          id="folder-select"
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-gray-100 focus:outline-none focus:border-plex transition-colors mb-6"
        >
          <option value="">Loading folders…</option>
        </select>

        <div class="flex gap-3">
          <button
            onclick="closeModal()"
            class="flex-1 px-4 py-2 rounded-lg border border-gray-700 text-sm text-gray-300 hover:bg-gray-800 transition-colors"
          >
            Cancel
          </button>
          <button
            id="modal-confirm-btn"
            onclick="confirmAddToRadarr()"
            class="flex-1 px-4 py-2 rounded-lg bg-plex hover:bg-plex-dark text-black font-semibold text-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Add Movie
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Sonarr "Add Series" modal -->
  <div id="sonarr-modal" class="fixed inset-0 z-50 hidden">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" onclick="closeSonarrModal()"></div>
    <!-- Panel -->
    <div class="relative flex items-center justify-center min-h-screen p-4">
      <div class="relative bg-gray-900 border border-gray-700 rounded-xl shadow-2xl w-full max-w-md p-6">
        <!-- Close button -->
        <button onclick="closeSonarrModal()" class="absolute top-4 right-4 text-gray-500 hover:text-gray-300 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>

        <h2 class="text-lg font-semibold text-white mb-1">Add to Sonarr</h2>
        <p id="sonarr-modal-series-title" class="text-plex font-medium text-sm mb-5"></p>

        <label class="block text-sm text-gray-400 mb-1.5">Download folder</label>
        <select
          id="sonarr-folder-select"
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-gray-100 focus:outline-none focus:border-plex transition-colors mb-6"
        >
          <option value="">Loading folders…</option>
        </select>

        <div class="flex gap-3">
          <button
            onclick="closeSonarrModal()"
            class="flex-1 px-4 py-2 rounded-lg border border-gray-700 text-sm text-gray-300 hover:bg-gray-800 transition-colors"
          >
            Cancel
          </button>
          <button
            id="sonarr-modal-confirm-btn"
            onclick="confirmAddToSonarr()"
            class="flex-1 px-4 py-2 rounded-lg bg-plex hover:bg-plex-dark text-black font-semibold text-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Add Series
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/main.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
